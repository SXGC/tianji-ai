# SonarQube 项目配置
sonar.projectKey=tianji-ai
sonar.projectName=Tianji AI
sonar.projectVersion=1.0.0

# 源码配置
sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/__tests__/**

# 测试配置
sonar.tests=apps,packages
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/__tests__/**

# TypeScript 配置 - monorepo 下各子包的覆盖率报告路径
sonar.typescript.lcov.reportPaths=\
  apps/node/coverage/lcov.info,\
  apps/controlplane/coverage/lcov.info,\
  packages/agent/coverage/lcov.info,\
  packages/runtime/coverage/lcov.info,\
  packages/shared/coverage/lcov.info,\
  packages/observer/coverage/lcov.info

# 编码
sonar.sourceEncoding=UTF-8
